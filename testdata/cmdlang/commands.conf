# Command separators, blocks, aliases, flags.
set -g @a 1 ; set -g @b 2
set -g @c 3; set -g @d 4
send "5;" ; send 6 \; send 7
send 8 ;; send 9
bind a { display "hi" ; split-window }
bind b {
  display one
  display two ; display three
}
bind c { bind d { display deep } }
if-shell true { set -g @h 8 } { set -g @h 9 }
set -gq status-style fg=red
set -wg pane-border-status top
setw -g mode-keys vi
set -g -s escape-time 0
resize-pane -R
resize-pane -R 3 -t %0
display -p -t %0 -F x
new -d -s x -- -x
send -t%0 -lN 3 -- -a
send -llll x
bind -n M-Left select-pane -L
bind -T copy-mode-vi v send -X begin-selection
set -g @z "a b" ; set -g @y 'c d'
run -b 'echo "#{pane_id}"'
splitp -h -t %0
info
bind x splitp
bind y { splitp -v ; info }
