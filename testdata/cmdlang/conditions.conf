# %if, %elif, %else and %endif with literal conditions; NAME=value.
%if 1
set -g @a yes
%endif
%if 0
set -g @b no
%elif "1"
set -g @b elif
%else
set -g @b else
%endif
%if ""
set -g @c no
%else
set -g @c else
%endif
%if 1
%if 0
set -g @d nested-no
%else
set -g @d nested-else
%endif
%endif
X=1
%hidden Y=2
set -g @e $X$Y
