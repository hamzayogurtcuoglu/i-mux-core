# The border options i-mux sets (its generated tmux.conf and theme), with the status line off
# so the screens show the borders alone.
set -g status off
set -g pane-border-status top
set -g pane-border-format " #{?@imux_name,#{@imux_name} · ,}#{?@imux_label,#{@imux_label},#{pane_current_command}} #{?@imux_flag,#{@imux_flag} ,}"
set -g pane-border-style 'bg=#1e1e2e,fg=#45475a'
set -g pane-active-border-style 'bg=#1e1e2e,fg=#89b4fa'
