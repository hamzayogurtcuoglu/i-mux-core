# A light theme over imux.conf's dark one: the colors i-mux's tab bar, borders and status read.
set -g  @imux_c_accent '#1e66f5'
set -g  @imux_c_panel_bg '#eff1f5'
set -g  @imux_c_sidebar_bg '#e6e9ef'
set -g  @imux_c_active_row_bg '#ccd0da'
set -g  @imux_c_surface0 '#ccd0da'
set -g  @imux_c_surface1 '#bcc0cc'
set -g  @imux_c_overlay1 '#8c8fa1'
set -g  @imux_c_text '#4c4f69'
set -g  @imux_c_subtext0 '#6c6f85'
set -g  status-style 'bg=#e6e9ef,fg=#6c6f85'
set -g  pane-border-style 'fg=#bcc0cc'
set -g  pane-active-border-style 'fg=#1e66f5'
