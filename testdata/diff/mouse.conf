# Bindings that log each mouse key (C5.1): what it is, mouse_* and the = target.
set -g mouse on
set -g status 2
set -g status-position top
set -g pane-border-status top
set -g status-format[0] '#[range=window|0]W0#[norange] #[range=window|1]W1#[norange] #[range=user|imux:tab]+#[norange]'
set -g status-format[1] '#[range=left]L#[norange] mid #[align=right range=right]R#[norange]'
set -g @n 0
set -g @log ''
unbind -a -T root
bind -n MouseDown1Pane { set -gF @log '#{@log}MouseDown1Pane:#{mouse_pane},#{mouse_x},#{mouse_y},#{mouse_status_line},#{mouse_status_range},#{window_index}.#{pane_index}|' ; set -gF @n '#{e|+:#{@n},1}' }
