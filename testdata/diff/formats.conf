# %if conditions are formats, expanded when the file is parsed (before its commands run), as
# i-mux's generated config uses them.
set -g @imux_loaded 1
%if "#{!=:#{@imux_loaded},1}"
set -g @branch parsed-before-set
%else
set -g @branch parsed-after-set
%endif
%if "#{==:#{e|+:1,2},3}"
set -g @math yes
%elif "1"
set -g @math elif
%endif
%if "#{@nothing}"
set -g @empty yes
%else
set -g @empty no
%endif
