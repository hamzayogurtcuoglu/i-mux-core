# The item's command is expanded when the menu is made; ## keeps mouse_pane and -t = for when
# it runs, with the event of the click that opened the menu.
bind -n MouseDown3Pane { display-menu -O -t= -xM -yM -T 'P #{mouse_pane}' 'Note' n { set -gF @m '##{mouse_pane}' ; set -pF -t= @p '##{pane_id}' } }
