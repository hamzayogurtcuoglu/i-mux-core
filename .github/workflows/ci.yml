name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Unit tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  lint:
    name: Lint (GOOS=${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  difftest:
    name: Difftest vs tmux 3.8 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tmux build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: tmux build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libevent ncurses
      - name: Cache the pinned tmux
        uses: actions/cache@v4
        with:
          path: .cache/tmux
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tmux.sh') }}
      - name: Build the pinned tmux
        run: make tmux
      - name: Differential tests
        env:
          IMUX_DIFFTEST_REQUIRE: "1"
        run: make difftest

  e2e:
    name: Engine e2e scenarios (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end scenarios
        run: make e2e

  imux-e2e:
    # i-mux's own e2e suite on imux-core (TASKS.md C6.2), at a pinned i-mux commit. Every
    # test passes (C6.3), so it blocks; PARITY.md is kept as an artifact.
    name: i-mux's e2e suite on imux-core
    runs-on: ubuntu-latest
    env:
      IMUX_COMMIT: 88903cca6c2b14affa6892b3c640eb0fdfada6c8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hamzayogurtcuoglu/i-mux
          ref: ${{ env.IMUX_COMMIT }}
          path: i-mux
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the suite
        run: ./scripts/imux-e2e.sh i-mux
      - name: Upload PARITY.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity
          path: PARITY.md

  bench:
    # ARCHITECTURE.md §10's performance targets against tmux (TASKS.md C6.4); BENCHMARKS.md is
    # kept as an artifact.
    name: Performance vs tmux 3.8 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      IMUX_COMMIT: 88903cca6c2b14affa6892b3c640eb0fdfada6c8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hamzayogurtcuoglu/i-mux
          ref: ${{ env.IMUX_COMMIT }}
          path: i-mux
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tmux build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
      - name: tmux build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libevent ncurses
      - name: Cache the pinned tmux
        uses: actions/cache@v4
        with:
          path: .cache/tmux
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tmux.sh') }}
      - name: Measure
        run: ./scripts/bench.sh i-mux
      - name: Startup timeline (informational)
        if: always()
        run: |
          .cache/bench/bench -tmux "$(./scripts/build-tmux.sh)" -core .cache/bench/imux-core \
            -imux .cache/bench/imux -fakes "$PWD/i-mux/e2e/fakeagents" -only startup -quick -trace || true
      - name: Latency, round trip and startup with GOMAXPROCS=1 (informational)
        if: always()
        env:
          GOMAXPROCS: "1"
        run: |
          .cache/bench/bench -tmux "$(./scripts/build-tmux.sh)" -core .cache/bench/imux-core \
            -imux .cache/bench/imux -fakes "$PWD/i-mux/e2e/fakeagents" -only latency,round-trip,start,startup || true
      - name: Upload BENCHMARKS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: BENCHMARKS.md

  conpty-spike:
    name: ConPTY and IPC evidence (C0.7, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gather the evidence
        env:
          CONPTY_EVIDENCE: ${{ runner.temp }}/conpty-evidence.md
        run: go test -count=1 -v -run 'TestEvidence|TestConsoleRoundTrip' ./spikes/conpty/
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conpty-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/conpty-evidence.md
